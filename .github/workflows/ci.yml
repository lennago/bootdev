name: ci

on:
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - 'learn-cicd/**'
    branches: [main]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./learn-cicd

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"

      - name: Run unit tests
        run: go test ./... -cover
  style:
    name: Style
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./learn-cicd
      
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"

      - name: Run style checks
        run: test -z $(go fmt ./...)

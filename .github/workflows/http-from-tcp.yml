name: http-from-tcp

on:
  pull_request:
    paths:
      - '.github/workflows/http-from-tcp.yml'
      - 'http-from-tcp/**'
    branches: [main]
  push:
    paths:
      - '.github/workflows/http-from-tcp.yml'
      - 'http-from-tcp/**'

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./http-from-tcp

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"

      - name: Run unit tests
        run: go test ./... -cover
      
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      
      - name: Run gosec
        run: gosec ./...

  style:
    name: Style
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./http-from-tcp
      
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.4"

      - name: Run style checks
        run: test -z $(go fmt ./...)

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest
      
      - name: Run staticcheck
        run: staticcheck ./...

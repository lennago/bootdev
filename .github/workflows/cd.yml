name: cd

on:
  push:
    paths:
      - '.github/workflows/ci.yml'
      - 'learn-cicd/**'
    branches: [main]

jobs:
    deploy:
        name: Deploy
        runs-on: ubuntu-latest
    
        defaults:
            run:
                working-directory: ./learn-cicd
        
        steps:
            - name: Check out code
              uses: actions/checkout@v6

            - name: Set up Go
              uses: actions/setup-go@v6
              with:
                    go-version: "1.27.1"
            
            - name: Build app
              run: ./scripts/buildprod.sh
